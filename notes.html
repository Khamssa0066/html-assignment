<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Notes</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <h1>My HTML Notes</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="notes.html">Notes</a>
        </nav>
    </header>

    <main>
        <dl>
            <dt>&lt;h1&gt;</dt>
            <dd>Defines the main heading.</dd>

            <dt>&lt;p&gt;</dt>
            <dd>Defines a paragraph.</dd>

            <dt>&lt;a&gt;</dt>
            <dd>Creates a hyperlink.</dd>

            <dt>&lt;img&gt;</dt>
            <dd>Displays an image.</dd>

            <dt>&lt;ul&gt;</dt>
            <dd>Creates an unordered list.</dd>
        </dl>
    </main>
</body>
</html>
